services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reef_catch
      POSTGRES_USER: reef_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - reef_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  reef_postgres:
